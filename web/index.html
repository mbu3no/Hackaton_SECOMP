<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaga Fantasma</title>
<!-- CSS inline de proposito: o painel precisa funcionar sem internet no dia do pitch. -->
<style>
  :root{
    --bg:#0b1220; --panel:#141d2e; --panel-2:#1a2438; --line:#25314a;
    --txt:#e8edf5; --dim:#8b9ab4; --faint:#5b6981;
    --livre:#22c55e; --ocupado:#ef4444; --fantasma:#f59e0b; --pessoa:#60a5fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.45;
  }
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.02em}

  /* ---------- cabecalho ---------- */
  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:16px 22px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#101a2b,#0b1220);
  }
  .brand{display:flex; align-items:baseline; gap:11px}
  .brand h1{margin:0; font-size:1.2rem; font-weight:750; letter-spacing:-.02em}
  .brand .loc{color:var(--dim); font-size:.86rem}
  .live{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    font-size:.78rem; color:var(--dim); border:1px solid var(--line);
    background:var(--panel); border-radius:999px; padding:5px 13px;
  }
  .live b{color:var(--txt); font-weight:600}
  .beacon{width:7px; height:7px; border-radius:50%; background:var(--livre)}
  .beacon.on{animation:pulse 1.8s ease-in-out infinite}
  .beacon.off{background:var(--ocupado); animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- grade ---------- */
  main{
    display:grid; grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);
    gap:18px; padding:18px 22px 34px; max-width:1560px; margin:0 auto;
  }
  @media(max-width:1000px){ main{grid-template-columns:1fr} }
  .col{display:flex; flex-direction:column; gap:18px; min-width:0}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:15px}
  .card.flush{overflow:hidden}
  .card-h{
    padding:13px 16px; border-bottom:1px solid var(--line);
    font-size:.71rem; text-transform:uppercase; letter-spacing:.1em;
    color:var(--dim); font-weight:650; display:flex; align-items:center; gap:9px;
  }
  .card-h .tag{margin-left:auto; text-transform:none; letter-spacing:0; color:var(--faint); font-weight:500}
  .card.flush img{width:100%; display:block}

  /* ---------- comparacao aparente x real ---------- */
  .gap-hero{padding:18px 16px 16px}
  .bar-row{margin-bottom:15px}
  .bar-lab{display:flex; align-items:baseline; gap:8px; margin-bottom:7px; font-size:.83rem}
  .bar-lab .t{color:var(--dim)}
  .bar-lab .v{margin-left:auto; font-weight:750; font-size:1.02rem}
  .bar{height:11px; border-radius:6px; background:#0d1626; overflow:hidden; display:flex}
  .bar i{display:block; height:100%; transition:width .45s cubic-bezier(.4,0,.2,1)}
  .verdict{
    margin-top:4px; padding:12px 14px; border-radius:11px;
    background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.32);
    font-size:.88rem; color:#fcd9a0;
  }
  .verdict.clean{background:rgba(34,197,94,.09); border-color:rgba(34,197,94,.3); color:#a7ecc0}
  .verdict b{font-size:1.05rem}

  /* ---------- metricas ---------- */
  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .kpi{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:13px 12px; text-align:center}
  .kpi .n{font-size:1.75rem; font-weight:800; line-height:1.1}
  .kpi .l{font-size:.67rem; text-transform:uppercase; letter-spacing:.09em; color:var(--dim); margin-top:3px}

  /* ---------- lista de assentos ---------- */
  .seat{display:flex; align-items:center; gap:11px; padding:11px 16px; border-bottom:1px solid var(--line); font-size:.88rem}
  .seat:last-child{border-bottom:none}
  .dot{width:10px; height:10px; border-radius:50%; flex:none}
  .seat .id{font-weight:700; width:34px; flex:none}
  .seat .st{text-transform:capitalize; font-weight:600}
  .seat .meta{margin-left:auto; color:var(--faint); font-size:.78rem; text-align:right; white-space:nowrap}

  /* ---------- alertas ---------- */
  .alert{
    display:flex; gap:11px; align-items:flex-start;
    padding:13px 15px; border-bottom:1px solid var(--line); font-size:.87rem;
  }
  .alert:last-child{border-bottom:none}
  .alert .ic{
    width:24px; height:24px; border-radius:7px; flex:none; margin-top:1px;
    background:rgba(245,158,11,.16); color:var(--fantasma);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem;
  }
  .alert b{color:var(--fantasma)}
  .alert .sub{color:var(--faint); font-size:.78rem; margin-top:2px}
  .empty{padding:22px 16px; text-align:center; color:var(--faint); font-size:.85rem}

  /* ---------- planta ---------- */
  #plan{width:100%; height:auto; display:block; background:#0d1626}
  .legend{display:flex; gap:15px; flex-wrap:wrap; padding:12px 16px; border-top:1px solid var(--line); font-size:.76rem; color:var(--dim)}
  .legend span{display:flex; align-items:center; gap:6px}
  .legend i{width:9px; height:9px; border-radius:50%; display:inline-block}

  .bg-livre{background:var(--livre)} .bg-ocupado{background:var(--ocupado)}
  .bg-fantasma{background:var(--fantasma)} .bg-pessoa{background:var(--pessoa)}
  .c-livre{color:var(--livre)} .c-ocupado{color:var(--ocupado)} .c-fantasma{color:var(--fantasma)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Vaga Fantasma</h1>
    <span class="loc">Sala de estudos, ocupação em tempo real</span>
  </div>
  <div class="live">
    <span class="beacon on" id="beacon"></span>
    <span id="live-txt">conectando</span>
  </div>
</header>

<main>
  <!-- coluna esquerda: video e planta -->
  <div class="col">
    <div class="card flush">
      <div class="card-h">Câmera
        <span class="tag" id="tag-fps"></span>
      </div>
      <img src="/video_feed" alt="Vídeo anotado ao vivo">
    </div>

    <div class="card flush" id="plan-card" style="display:none">
      <div class="card-h">Planta baixa, vista de cima
        <span class="tag" id="plan-dims"></span>
      </div>
      <svg id="plan" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <span><i class="bg-livre"></i>Livre</span>
        <span><i class="bg-ocupado"></i>Ocupado</span>
        <span><i class="bg-fantasma"></i>Fantasma</span>
        <span><i class="bg-pessoa"></i>Pessoa detectada</span>
      </div>
    </div>
  </div>

  <!-- coluna direita: numeros -->
  <div class="col">
    <div class="card">
      <div class="card-h">O que um contador comum veria</div>
      <div class="gap-hero">
        <div class="bar-row">
          <div class="bar-lab">
            <span class="t">Ocupação aparente</span>
            <span class="v num" id="v-aparente">0%</span>
          </div>
          <div class="bar"><i id="b-aparente" class="bg-ocupado" style="width:0%"></i></div>
        </div>
        <div class="bar-row">
          <div class="bar-lab">
            <span class="t">Ocupação real</span>
            <span class="v num c-livre" id="v-real">0%</span>
          </div>
          <div class="bar"><i id="b-real" class="bg-livre" style="width:0%"></i></div>
        </div>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="n num c-livre"    id="c-livre">0</div><div class="l">Livres</div></div>
      <div class="kpi"><div class="n num c-ocupado"  id="c-ocupado">0</div><div class="l">Ocupados</div></div>
      <div class="kpi"><div class="n num c-fantasma" id="c-fantasma">0</div><div class="l">Fantasmas</div></div>
    </div>

    <div class="card flush">
      <div class="card-h">Alertas
        <span class="tag" id="tag-ghost"></span>
      </div>
      <div id="alerts"></div>
    </div>

    <div class="card flush">
      <div class="card-h">Assentos
        <span class="tag" id="tag-total"></span>
      </div>
      <div id="seats"></div>
    </div>
  </div>
</main>

<script>
const COR = {livre:'#22c55e', ocupado:'#ef4444', fantasma:'#f59e0b'};
const $ = id => document.getElementById(id);

function dur(s){
  if(s < 60) return Math.round(s) + 's';
  const m = Math.floor(s/60), r = Math.round(s%60);
  return r ? m + 'min ' + r + 's' : m + 'min';
}

/* ------------------------------------------------ planta baixa (SVG) */
const PW = 640, PH = 400, PAD = 30;
const px = v => PAD + v * (PW - 2*PAD);
const py = v => PAD + v * (PH - 2*PAD);
const dentro = (x, y, m) => x >= -m && x <= 1+m && y >= -m && y <= 1+m;

function desenhaPlanta(d){
  const card = $('plan-card');
  if(!d.plan){ card.style.display = 'none'; return; }
  card.style.display = 'block';

  const larg = d.plan.size_m[0], prof = d.plan.size_m[1];
  $('plan-dims').textContent = larg + 'm x ' + prof + 'm';

  let g = '';
  // Grade de 1 metro. Se a homografia estiver correta, sai regular.
  for(let m = 0; m <= larg; m++){
    const x = px(m/larg);
    g += '<line x1="'+x+'" y1="'+py(0)+'" x2="'+x+'" y2="'+py(1)+'" stroke="#1c2740" stroke-width="1"/>';
  }
  for(let m = 0; m <= prof; m++){
    const y = py(m/prof);
    g += '<line x1="'+px(0)+'" y1="'+y+'" x2="'+px(1)+'" y2="'+y+'" stroke="#1c2740" stroke-width="1"/>';
  }
  g += '<rect x="'+px(0)+'" y="'+py(0)+'" width="'+(px(1)-px(0))+'" height="'+(py(1)-py(0))+'" fill="none" stroke="#2d3b56" stroke-width="1.5" rx="5"/>';

  // Pessoas, projetadas pelos pes no plano do chao.
  for(const p of (d.people_plan_xy || [])){
    const x = p[0], y = p[1];
    if(!dentro(x, y, .15)) continue;
    g += '<circle cx="'+px(x)+'" cy="'+py(y)+'" r="16" fill="#60a5fa" opacity=".14"/>';
    g += '<circle cx="'+px(x)+'" cy="'+py(y)+'" r="6.5" fill="#60a5fa"/>';
  }

  // Assentos.
  for(const s of d.seats){
    if(!s.plan_xy || !dentro(s.plan_xy[0], s.plan_xy[1], .3)) continue;
    const cx = px(s.plan_xy[0]), cy = py(s.plan_xy[1]), cor = COR[s.state];
    if(s.state === 'fantasma'){
      g += '<circle cx="'+cx+'" cy="'+cy+'" r="18" fill="'+cor+'" opacity=".2">'
         + '<animate attributeName="r" values="15;28;15" dur="1.7s" repeatCount="indefinite"/>'
         + '<animate attributeName="opacity" values=".3;0;.3" dur="1.7s" repeatCount="indefinite"/>'
         + '</circle>';
    }
    g += '<rect x="'+(cx-14)+'" y="'+(cy-14)+'" width="28" height="28" rx="7" fill="'+cor+'"/>';
    g += '<text x="'+cx+'" y="'+(cy+4.5)+'" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0b1220" font-family="inherit">'+s.id+'</text>';
  }

  g += '<text x="'+(PW/2)+'" y="'+(PH-8)+'" text-anchor="middle" font-size="10.5" fill="#5b6981" font-family="inherit">posição da câmera</text>';

  $('plan').innerHTML = g;
}

/* ------------------------------------------------ ciclo de atualizacao */
async function tick(){
  let d;
  try{
    const res = await fetch('/api/state');
    d = await res.json();
  }catch(e){
    $('beacon').className = 'beacon off';
    $('live-txt').textContent = 'sem sinal';
    return;
  }
  $('beacon').className = 'beacon on';
  $('live-txt').innerHTML = 'ao vivo <b>' + d.fps + ' FPS</b>';
  $('tag-fps').textContent = d.fps + ' FPS, detecção ' + d.detect_hz + ' Hz (' + d.detect_ms + ' ms)';
  $('tag-total').textContent = d.total + ' monitorados';

  const livre = d.counts.livre, ocup = d.counts.ocupado, fant = d.counts.fantasma;
  $('c-livre').textContent = livre;
  $('c-ocupado').textContent = ocup;
  $('c-fantasma').textContent = fant;

  // A comparacao que define o projeto: um contador comum soma ocupados e
  // fantasmas, porque nao distingue pessoa de mochila.
  const total = d.total || 1;
  const aparente = Math.round((ocup + fant) / total * 100);
  const real = Math.round(ocup / total * 100);
  $('v-aparente').textContent = aparente + '%';
  $('v-real').textContent = real + '%';
  $('b-aparente').style.width = aparente + '%';
  $('b-real').style.width = real + '%';

  const vd = $('verdict');
  if(fant > 0){
    const p = fant > 1;
    vd.className = 'verdict';
    vd.innerHTML = '<b>' + fant + '</b> vaga' + (p?'s':'') + ' invisíve' + (p?'is':'l')
      + '. ' + (p?'Elas contam':'Ela conta') + ' como ocupada' + (p?'s':'')
      + ', mas ninguém está ' + (p?'nelas':'nela') + '.';
  }else{
    vd.className = 'verdict clean';
    vd.innerHTML = 'Nenhuma vaga desperdiçada. Ocupação aparente e real coincidem.';
  }

  // Alertas, do abandono mais antigo para o mais recente.
  const ghosts = d.seats.filter(s => s.state === 'fantasma')
                        .sort((a,b) => b.abandoned_for - a.abandoned_for);
  $('tag-ghost').textContent = ghosts.length ? ghosts.length + ' ativo' + (ghosts.length>1?'s':'') : '';
  $('alerts').innerHTML = ghosts.length
    ? ghosts.map(s =>
        '<div class="alert"><span class="ic">!</span><div>'
        + 'Assento <b>' + s.id + '</b> reservado por '
        + (s.labels.join(', ') || 'um objeto')
        + ' há <b>' + dur(s.abandoned_for) + '</b>.'
        + '<div class="sub">Sem presença detectada desde então.</div>'
        + '</div></div>').join('')
    : '<div class="empty">Nenhum alerta ativo.</div>';

  // Lista de assentos
  $('seats').innerHTML = d.seats.map(s =>
    '<div class="seat">'
    + '<span class="dot bg-' + s.state + '"></span>'
    + '<span class="id">' + s.id + '</span>'
    + '<span class="st c-' + s.state + '">' + s.state + '</span>'
    + '<span class="meta">' + (s.labels.join(', ') || 'vazio')
    + ' &middot; ' + dur(s.seconds_in_state) + '</span>'
    + '</div>').join('');

  desenhaPlanta(d);
}

tick();
setInterval(tick, 500);
</script>
</body>
</html>
